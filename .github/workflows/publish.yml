# Tag-only publish to GitHub Packages.
# Copy this file into the private llanesleonardo/saas-platform repository root as
# .github/workflows/publish.yml after the subtree split (phase 70).
name: Publish package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
          scope: "@llanesleonardo"

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run typecheck && npm run build

      - name: Inspect tarball
        run: npm pack --dry-run

      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG pkg=$PKG"
          test "$TAG" = "$PKG"

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
